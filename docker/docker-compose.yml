    # Idra back-end latest version
    idra:
            # build local
            build:
              context: ..
              dockerfile: ./Dockerfile
            ports:
                - 8080:8080
            depends_on:
                - db
                # - rdf4j
            command: ["./wait-for-it.sh", "db:3306", "--timeout=0", "--", "catalina.sh", "run"]

            environment:
                - idra.db.host=jdbc:mysql://db:3306/idra_db?allowPublicKeyRetrieval=true&serverTimezone=UTC&useLegacyDatetimeCode=false&useEncoding=true&characterEncoding=UTF-8&useSSL=false
                - idra.db.host.min=jdbc:mysql://db:3306
                - idra.db.user_FILE=/run/secrets/my_secret_data
                - idra.db.password_FILE=/run/secrets/my_secret_data
                #- idra.db.user=root
                #- idra.db.password=root
                - idra.db.name=idra_db
                - idra.cache.loadfromdb=true
                - idra.synch.onstart=false
                - idra.odms.dump.file.path=/opt/idra/dump/
                - idra.dump.file.path=/opt/idra/dump/
                - idra.lod.enable=true
                - idra.lod.repo.name=Idra
                - idra.lod.server.uri=http://rdf4j:8080/rdf4j-server/repositories/
                - idra.lod.server.uri.query=http://rdf4j:8080/rdf4j-workbench/repositories/Idra/query
                - idra.orion.orionDumpFilePath=/opt/idra/dump/
                - idra.orion.orionInternalAPI=http://localhost:8080/Idra/api/v1/client/executeOrionQuery
                - DATALET_ENABLED=true
                - DATALET_URL=https://your-domain.it/deep/deep-components/demo.html
                - JAVA_OPTS=-Xms1024m -Xmx3g
                - idra.orion.manager.url=http://ngsi-broker:8082/
            # env variables for KEYCLOAK authentication
                - idra.authentication.method=KEYCLOAK
                - idm.protocol=http
                - idm.host=keycloak:8080/auth/realms/smartera/protocol/openid-connect
                - idm.path.base=
                - idm.client.id=data-platform
                - idm.client.secret=
                - idm.redirecturi=http://localhost:8080/Idra/api/v1/administration/login
                - idm.logout.callback=http://localhost:4200
                - idra.server.baseurl=http://localhost:8080/
                - idm.admin.role.name=IDRA_ADMIN
            secrets:
                - my_secret_data           
            volumes:
                - ./opt/idra/dump:/opt/idra/dump
                - /dev/urandom:/dev/random
            networks:
                idra_main:

    portal:
        build:
            context: ../../IdraPortal-ngx
            dockerfile: ./Dockerfile
            args:
                BUILD_CONFIGURATION: docker
                BASE_HREF: /
        restart: always
        ports:
            - "4200:80"
        volumes:
            - ./config.json:/usr/share/nginx/html/assets/config.json:ro
        networks:
            idra_main:

    
    ngsi-broker:
        build:
            context: ../../NGSI-LDBrokerManager
            dockerfile: ./Dockerfile
        container_name: "ngsi-broker"
        ports:
        - 8082:8082
        environment:
        - SERVER_DEBUG=true
        - IDRA_BASE_PATH=http://idra:8080
        - HOST_ORION=http://orion-ld-SMARTERA-final
        - PORT_ORION=1026
        networks:
            idra_main:

    
    mongo-orion-SMARTERA-final:
        image: mongo:4.4.30
        container_name: mongodb-orion-SMARTERA-final
        #restart: unless-stopped
        ports:
            - "127.0.0.1:27017:27017"
        #environment:
        #  - MONGO_INITDB_ROOT_USERNAME:root
        #  - MONGO_INITDB_ROOT_PASSWORD:psswd123
        #command: --nojournal
        volumes:
            - ./mongo-data:/data
        networks:
            idra_main:
 
    orion-ld-SMARTERA-final:
        image: fiware/orion-ld
        container_name: orion-ld-SMARTERA-final
        links:
            - mongo-orion-SMARTERA-final
        ports:
            - "1026:1026"
        #environment:
        #  - ORION_MONGO_HOST=mongo
        #  - ORION_MONGO_PORT=27017
        #  - ORION_MONGO_USER=root
        #  - ORION_MONGO_PASSWORD=psswd123
        #  - ORION_DB_NAME=admin
        command: -dbhost mongo-orion-SMARTERA-final
        networks:
            idra_main:

networks:
    idra_main:
          driver: bridge
          
secrets:
  my_secret_data:
    file: ./secrets.txt
