services:
    db:
        image: mysql:8.4
        restart: always
        ports:
            - 3306:3306
        volumes:
            - ./opt/idra/mysql-data:/var/lib/mysql
            - ./db-config/idra_db.sql:/docker-entrypoint-initdb.d/idra_db.sql
        networks:
            idra_main:
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}

        command: --lower_case_table_names=1

    keycloak-db:
            image: postgres:16
            restart: always
            environment:
                - POSTGRES_DB=${POSTGRES_DB}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            volumes:
                - ./opt/keycloak/postgres-data:/var/lib/postgresql/data
            networks:
                idra_main:

    keycloak:
            image: quay.io/keycloak/keycloak:26.2.5
            restart: always
            depends_on:
                - keycloak-db
            ports:
                - 8180:8080
            environment:
                - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
                - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
                - KC_DB=postgres
                - KC_DB_URL_HOST=keycloak-db
                - KC_DB_URL_DATABASE=${POSTGRES_DB}
                - KC_DB_USERNAME=${POSTGRES_USER}
                - KC_DB_PASSWORD=${KC_DB_PASSWORD}
                # Keep the legacy "/auth" base path to match existing Portal config.
                - KC_HTTP_RELATIVE_PATH=/auth
                - KC_HOSTNAME_STRICT=false
                # Pin the token issuer to the PUBLIC (browser-facing) URL so tokens
                # minted via the browser and refreshed via the Idra BFF (which reaches
                # Keycloak internally at keycloak:8080) validate against the same `iss`.
                # Without this the refresh returns 400 invalid_grant "Invalid token issuer".
                - KC_HOSTNAME=${KEYCLOAK_HOSTNAME_URL}
                # Let backchannel callers (the Idra container) keep using the internal
                # keycloak:8080 host for connectivity while the issuer stays pinned above.
                - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
            command: ["start-dev", "--import-realm", "--http-port=8080"]
            volumes:
                - ./keycloak/realm-smartera-local.json:/opt/keycloak/data/import/realm-smartera-local.json:ro
                - ./smartera:/opt/keycloak/themes/smartera/
            networks:
                idra_main:

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: always
        ports:
            - 8086:80
        environment:
            - PMA_HOST=db
            - PMA_PORT=3306
        depends_on:
            - db
        networks:
            idra_main:
    
    rdf4j:
        image: yyz1989/rdf4j
        ports:
            - 8081:8080
        volumes:
            - ./opt/idra/rdf4j-data:/opt/rdf4j/data
        environment:
            - RDF4J_DATA=/opt/rdf4j/data
        networks:
            idra_main:
    
    deep:
        image: idraopendata/deep:2.2.6
        ports:
            - 80:80
        volumes:
            - ./deep/configuration.js:/var/www/app/deep/deep-components/configuration.js
        networks:
            idra_main:
    
    # # NEW VERSION OF THE IDRA PORTAL - integrated with Metadata Quality Validator Tool
    # idraNewPortal:
    #         image: idraopendata/idra-portal:latest
    #         ports:
    #             - "4200:80"
    #         volumes:
    #             - ./idra-new-portal-config/config.json:/usr/share/nginx/html/assets/config.json
    #             - ./idra-new-portal-config/nginx.conf:/etc/nginx/conf.d/default.conf
    
    # Metadata Quality Validator Tool
    mqa-score:
        build:
            context: ../../mqa-scoring
            dockerfile: ./Dockerfile
        container_name: mqa-score
        restart: always
        ports:
            - "8000:8000"
        environment:
            - PORT=8000
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
            - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
            - MINIO_URL=${MINIO_URL}
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
            - MINIO_ACTIVE=${MINIO_ACTIVE}
        networks:
            idra_main:

    # Database used by the Metadata Quality Validator Tool
    mongodb:
        container_name: mongodb-mqa
        image: mongo:4.4
        command: mongod --port 27020
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
            - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
        ports:
            - "27020:27020"
        volumes:
            - ./data:/data/db  
        networks:
            idra_main:
    # ngsi-broker:
    #     image: engineeringopsilab/ngsi-ldbrokermanager:v1.7
    #     container_name: "ngsi-broker-SMARTERA"
    #     ports:
    #         - 8082:8082
    #     environment:
    #         - SERVER_DEBUG=true
    #         - IDRA_BASE_PATH=http://idra:8080/
    #         - HOST_ORION=http://localhost:1027
    #         - PORT_ORION=
    #     networks:
    #         idra_main:
    # Idra back-end latest version
    idra:
        # build local
        build:
            context: ..
            dockerfile: ./Dockerfile
        ports:
            - 8080:8080
        depends_on:
            - db
            - ngsi-broker
            # - rdf4j
        command: ["./wait-for-it.sh", "db:3306", "--timeout=0", "--", "catalina.sh", "run"]

        environment:
            - idra.db.host=${IDRA_DB_HOST}
            - idra.db.host.min=${IDRA_DB_HOST_MIN}
            - idra.db.user=${IDRA_DB_USER}
            - idra.db.password=${IDRA_DB_PASSWORD}
            - idra.db.name=${IDRA_DB_NAME}
            - idra.cache.loadfromdb=true
            - idra.synch.onstart=true
            - idra.odms.dump.file.path=/opt/idra/dump/
            - idra.dump.file.path=/opt/idra/dump/
            - idra.lod.enable=true
            - idra.lod.repo.name=Idra
            - idra.lod.server.uri=${IDRA_LOD_SERVER_URI}
            - idra.lod.server.uri.query=${IDRA_LOD_SERVER_URI_QUERY}
            - idra.orion.orionDumpFilePath=/opt/idra/dump/
            - idra.orion.orionInternalAPI=${IDRA_ORION_INTERNAL_API}
            - DATALET_ENABLED=${DATALET_ENABLED}
            - DATALET_URL=${DATALET_URL}
            - JAVA_OPTS=${JAVA_OPTS}
            - idra.orion.manager.url=${IDRA_ORION_MANAGER_URL}
            - idra.orion.cb.url=${IDRA_ORION_CB_URL}
        # env variables for KEYCLOAK authentication
            - idra.authentication.method=${IDRA_AUTH_METHOD}
            - idm.protocol=${IDM_PROTOCOL}
            - idm.host=${IDM_HOST}
            - idm.path.base=${IDM_PATH_BASE}
            - idm.client.id=${IDM_CLIENT_ID}
            - idm.client.secret=${IDM_CLIENT_SECRET}
            - idm.redirecturi=${IDM_REDIRECTURI}
            - idm.logout.callback=${IDM_LOGOUT_CALLBACK}
            - idra.server.baseurl=${IDRA_SERVER_BASEURL}
            - idm.admin.role.name=${IDM_ADMIN_ROLE_NAME}
        volumes:
            - ./opt/idra/dump:/opt/idra/dump
            - /dev/urandom:/dev/random
        networks:
            idra_main:

    portal:
        build:
            context: ../../IdraPortal-ngx
            dockerfile: ./Dockerfile
            args:
                BUILD_CONFIGURATION: docker
                BASE_HREF: /
        restart: always
        ports:
            - "4200:80"
        # Runtime config: rendered into assets/env.js at container startup
        # (no config.json volume). Empty values fall back to localhost defaults.
        environment:
            - PORTAL_ENABLE_AUTHENTICATION=${PORTAL_ENABLE_AUTHENTICATION}
            - PORTAL_AUTHENTICATION_METHOD=${PORTAL_AUTHENTICATION_METHOD}
            - PORTAL_KEYCLOAK_BASE_URL=${PORTAL_KEYCLOAK_BASE_URL}
            - PORTAL_KEYCLOAK_REALM=${PORTAL_KEYCLOAK_REALM}
            - PORTAL_DASHBOARD_BASE_URL=${PORTAL_DASHBOARD_BASE_URL}
            - PORTAL_CLIENT_ID=${PORTAL_CLIENT_ID}
            - PORTAL_AUTH_PROFILE=${PORTAL_AUTH_PROFILE}
            - PORTAL_IDRA_BASE_URL=${PORTAL_IDRA_BASE_URL}
            - PORTAL_ENABLE_DATALET=${PORTAL_ENABLE_DATALET}
            - PORTAL_DATALET_BASE_URL=${PORTAL_DATALET_BASE_URL}
            - PORTAL_MQA_BASE_URL=${PORTAL_MQA_BASE_URL}
            - PORTAL_IDRA_DOCKER_URL=${PORTAL_IDRA_DOCKER_URL}
            - PORTAL_LANGUAGES=${PORTAL_LANGUAGES}
            - PORTAL_ORION_MANAGER_ENABLED=${PORTAL_ORION_MANAGER_ENABLED}
            - PORTAL_TRANSLATIONS_BASE_URL=${PORTAL_TRANSLATIONS_BASE_URL}
        networks:
            idra_main:

    
    ngsi-broker:
        build:
            context: ../../NGSI-LDBrokerManager
            dockerfile: ./Dockerfile
        container_name: "ngsi-broker"
        ports:
        - 8082:8082
        environment:
        - SERVER_DEBUG=${NGSI_SERVER_DEBUG}
        - IDRA_BASE_PATH=${NGSI_IDRA_BASE_PATH}
        - HOST_ORION=${NGSI_HOST_ORION}
        - PORT_ORION=${NGSI_PORT_ORION}
        # Context Broker hosts exempt from the SSRF private-address check
        # (the internal Orion broker lives on the docker network → private IP).
        - CB_URL_ALLOWLIST=${NGSI_CB_URL_ALLOWLIST}
        networks:
            idra_main:

    
    mongo-orion-SMARTERA-final:
        image: mongo:4.4.30
        container_name: mongodb-orion-SMARTERA-final
        #restart: unless-stopped
        ports:
            - "127.0.0.1:27017:27017"
        #environment:
        #  - MONGO_INITDB_ROOT_USERNAME:root
        #  - MONGO_INITDB_ROOT_PASSWORD:psswd123
        #command: --nojournal
        volumes:
            - ./mongo-data:/data
        networks:
            idra_main:
 
    orion-ld-SMARTERA-final:
        image: fiware/orion-ld
        container_name: orion-ld-SMARTERA-final
        links:
            - mongo-orion-SMARTERA-final
        ports:
            - "1026:1026"
        #environment:
        #  - ORION_MONGO_HOST=mongo
        #  - ORION_MONGO_PORT=27017
        #  - ORION_MONGO_USER=root
        #  - ORION_MONGO_PASSWORD=psswd123
        #  - ORION_DB_NAME=admin
        command: -dbhost mongo-orion-SMARTERA-final
        networks:
            idra_main:

networks:
    idra_main:
          driver: bridge
