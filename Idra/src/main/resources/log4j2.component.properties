# Force log4j2 to capture the ThreadContextMap in LogEvent's contextData so the
# %X{correlationId} pattern in log4j2.xml resolves at format time. Without this,
# log4j-web's webapp-mode defaults emit empty values even when ThreadContext is
# populated by CorrelationIdFilter / CorrelationIdJobListener.
log4j2.disableThreadContextMap=false
log4j2.disableThreadContext=false
log4j2.isThreadContextMapInheritable=true
