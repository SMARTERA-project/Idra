################# PLATFORM API ###################################
idra.version=3.1.0
idra.release.timestamp=2025-03-24T13:00:00Z

################# PERSISTENCE MANAGER CONFIGURATION ##############
# Database configuration - override via environment variables or system properties
# DEVELOPMENT DEFAULTS BELOW - DO NOT USE IN PRODUCTION
# Set via env: IDRA_DB_HOST, IDRA_DB_USER, IDRA_DB_PASSWORD, IDRA_DB_NAME
#&rewriteBatchedStatements\=true
idra.db.host= jdbc\:mysql\://localhost:3306/idra_db?allowPublicKeyRetrieval=true&serverTimezone\=UTC&&useEncoding\=true&characterEncoding\=UTF-8&useSSL\=false
idra.db.host.min=jdbc\:mysql\:localhost:3306
idra.db.user=root
idra.db.password=root
idra.db.name = idra_db

### PROXY ### 
http.proxyEnabled=false
http.proxyHost=
http.proxyPort=
http.proxyUser=
http.proxyPassword=
http.nonProxyHosts=localhost|*.eng.it

################# CACHE MANAGEMENT ###############################
idra.cache.loadfromdb=false
idra.synch.onstart=false

################# DCATAP ODMS NODE DUMP  #########################
idra.odms.dump.file.prefix=odmsDump
#### NOTE: THIS PATH MUST ENDS WITH \\ or / #########
# DEVELOPMENT DEFAULT - override via IDRA_ODMS_DUMP_FILE_PATH environment variable
# Windows: C:\\\\Users\\\\username\\\\Desktop\\\\dump_idra\\\\
# Linux: /opt/idra/dump/
idra.odms.dump.file.path=C:\\Users\\ACER\\Desktop\\dump_idra\\
# idra.odms.dump.file.path=/home/ubuntu/Idra/dump_idra/ 

################# DCATAP GLOBAL DUMP #############################
# DEVELOPMENT DEFAULT - override via IDRA_DUMP_FILE_PATH environment variable
idra.dump.file.path=C:\\Users\\ACER\\Desktop\\dump_idra\\
#idra.dump.file.path=/home/ubuntu/Idra/dump_idra/
idra.dump.file.name=globalDump
#idra.dump.file.zip=true
idra.dump.period=86400
idra.dump.format=RDFXML
idra.dump.profile=DCATAP
idra.dump.onstart=false

################# ORION FILE DUMP DIRECTORY #############################
# DEVELOPMENT DEFAULT - override via IDRA_ORION_DUMP_FILE_PATH environment variable
# idra.orion.orionDumpFilePath=/home/ubuntu/Idra/dump_idra/
idra.orion.orionDumpFilePath=C:\\Users\\ACER\\Desktop\\dump_idra\\
# DEVELOPMENT DEFAULT - override via IDRA_ORION_INTERNAL_API environment variable
idra.orion.orionInternalAPI=http://localhost:8080/Idra/api/v1/client/executeOrionQuery
################# CONTEXT BROKER MANAGER COMPONENT FOR DCATAP/NGSILD MANAGEMENT #############################
# DEVELOPMENT DEFAULT - override via IDRA_ORION_MANAGER_URL environment variable
idra.orion.manager.url=http://localhost:8082/
# Context Broker (Orion) direct URL - override via IDRA_ORION_CB_URL environment variable
idra.orion.cb.url=http://localhost:1026/

################# WEB SCRAPER CONFIGURATION ######################
idra.scraper.pagination.retry=10
idra.scraper.page.retry=10
idra.scraper.range.retry=10
idra.scraper.range.scale=25
idra.scraper.dataset.retry=10

# Following are milliseconds
idra.scraper.page.timeout=25000
idra.scraper.dataset.timeout=25000
idra.scraper.global.timeout=1800000
idra.scraper.throttling=250
idra.scraper.defaultStopValues=-,_,\\s

################# STATISTICS CONFIGURATION ######################
idra.statistics.enable=false

################# LOD MANAGER CONFIGURATION ######################
idra.lod.enable=false
idra.lod.repo.name=Idra
# DEVELOPMENT DEFAULT - override via IDRA_LOD_SERVER_URI environment variable
idra.lod.server.uri=http\://localhost\:8081/rdf4j-server/repositories/
# DEVELOPMENT DEFAULT - override via IDRA_LOD_SERVER_URI_QUERY environment variable
idra.lod.server.uri.query=http\://localhost\:8081/rdf4j-workbench/repositories/Idra/query

################# PREVIEW ###########################
#TIMEOUT (seconds)
idra.preview.timeout=10
#File dimension (MB)
idra.preview.fileSize=10

########################### AUTHENTICATION CONFIGURATION ##################
### SELECT WHICH AUTHENTICATION METHOD TO USE. ALLOWED VALUES: [KEYCLOAK]
idra.authentication.method=KEYCLOAK

### FIWARE-IDM INTEGRATION ###
############### IDM Common Configuration #############
########## Note. Now only used for Fiware integration, in future could be used for a generic OAuth2 integration
# KEYCLOAK AUTHENTICATION: Override these via environment variables in docker-compose
# Required env vars: IDM_PROTOCOL, IDM_HOST, IDM_CLIENT_ID, IDM_CLIENT_SECRET,
# IDM_REDIRECTURI, IDM_LOGOUT_CALLBACK, IDRA_SERVER_BASEURL

#idm.logout.callback=http://IDM_HOST/IdraPortal
idm.protocol=https
### INCLUDE ALSO THE PORT (IF ANY)
# DEVELOPMENT DEFAULT - override via IDM_HOST environment variable
# Example: localhost:8180/auth/realms/smartera/protocol/openid-connect
# idm.host=192.168.99.103:8080auth//realms/urbanite/protocol/openid-connect
idm.host=dx-lab.it/auth/realms/master/protocol/openid-connect
idm.path.base=
idm.path.token=/token
idm.path.user=/userinfo

#idm.fiware.keystone.host=auth.synchcity.eu
#idm.fiware.keystone.port=5000
#idm.fiware.keystone.path.tokens=/v3/auth/tokens

######### APPLICATION SPECIFIC #######################
# DEVELOPMENT DEFAULT - override via IDM_CLIENT_ID environment variable
idm.client.id=beopen-dashboard
# SECURITY WARNING: Set via IDM_CLIENT_SECRET environment variable in production
idm.client.secret=
# DEVELOPMENT DEFAULT - override via IDM_REDIRECTURI environment variable
idm.redirecturi=http://localhost:8080/Idra/api/v1/administration/login
# DEVELOPMENT DEFAULT - override via IDM_LOGOUT_CALLBACK environment variable
idm.logout.callback=http://localhost:8080/IdraPortal
### Role name that User must have in the IDM to be authenticated as Idra Administrator
idm.admin.role.name=IDRA_ADMIN

#The name of the deployed application to be redirected after login
#Leave blank if the application is deployed as ROOT e.g. in tomcat
idra.catalogue.basepath=/IdraPortal

#Used to create subscription for the Orion NGSI-LD Connector
# DEVELOPMENT DEFAULT - override via IDRA_SERVER_BASEURL environment variable
idra.server.baseurl=http://localhost:8080

# Multi-user RBAC bootstrap (Keycloak-only registration)
# Comma-separated emails/subs that should be promoted to SUPER_ADMIN on first authenticated access.
idra.bootstrap.admin.emails=
idra.bootstrap.admin.subs=
# Default role assigned to a newly provisioned user (must exist in DB).
idra.bootstrap.default.role=IDRA_USER
